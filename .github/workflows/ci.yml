name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libbluetooth-dev libsystemd-dev pkg-config
      - name: Check formatting
        run: zig fmt --check build.zig src tests
      - name: Build and test
        run: zig build check -Doptimize=ReleaseSafe
